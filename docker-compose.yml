# picasso — generated by `jfast workspace compose`.
# Do not edit by hand: regenerate after adding a service.
#
# Frontends are absent on purpose. A built SPA is static files, served
# by Caddy from ./picasso-web/dist — there is no container to run. Build it
# first (`npm run build` in the frontend), or Caddy serves nothing.
#
# One service on its own is generated by `jfast deploy compose`, which
# names its datastores after the plugin that wants them (`postgres`,
# `POSTGRES_PASSWORD`) rather than after a resource — see
# docs/deploy.md, `Two generators`.
#
# Containers are named by compose, from the project (the directory, or
# `docker compose -p <name>`) -- never pinned here, so an old copy of
# this workspace and a new one can run side by side.
services:
  picasso-database:
    image: "pgvector/pgvector:pg16"
    restart: unless-stopped
    ports:
      - "9801:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${PICASSO_DATABASE_PASSWORD:?set PICASSO_DATABASE_PASSWORD}"
    volumes:
      - "picasso_database_data:/var/lib/postgresql/data"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 5s
      timeout: 3s
      retries: 10
  picasso-cache:
    image: "redis:7-alpine"
    restart: unless-stopped
    ports:
      - "9803:6379"
    command: redis-server --appendonly yes
    volumes:
      - "picasso_cache_data:/data"
  picasso:
    build:
      context: ./picasso
    restart: unless-stopped
    env_file:
      - ./picasso/.env
    environment:
      JFAST_APP_NAME: picasso
      JFAST_PORT: 9800
      JFAST_DB_DSN: "postgresql+asyncpg://app:${PICASSO_DATABASE_PASSWORD}@picasso-database:5432/app"
      JFAST_CACHE_URL: "redis://picasso-cache:6379/0"
    ports:
      - "9800:9800"
    depends_on:
      picasso-database:
        condition: service_healthy
      picasso-cache:
        condition: service_started
  picasso-worker:
    build:
      context: ./picasso
    restart: unless-stopped
    env_file:
      - ./picasso/.env
    environment:
      JFAST_APP_NAME: picasso
      JFAST_PORT: 9800
      JFAST_DB_DSN: "postgresql+asyncpg://app:${PICASSO_DATABASE_PASSWORD}@picasso-database:5432/app"
      JFAST_CACHE_URL: "redis://picasso-cache:6379/0"
    command:
      - jfast
      - worker
      - "--grace=25"
    healthcheck:
      disable: true
    stop_grace_period: 30s
    depends_on:
      picasso-database:
        condition: service_healthy
      picasso-cache:
        condition: service_started
      picasso:
        condition: service_healthy
  caddy:
    image: "caddy:2-alpine"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./picasso-web/dist:/srv:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      - picasso
volumes:
  picasso_database_data: null
  picasso_cache_data: null
  caddy_data: null
  caddy_config: null
